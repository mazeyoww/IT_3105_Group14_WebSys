<body>
    
    <form> 
        <label for="firstname">First Name:</label>
        <input type="text" name="firstname" id="firstname">
        <br><br>
        <label for="firstname">Phone:</label>
        <input type="tel" id="phone" pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}">
        <br><br>
        
        <label for="colors">Colors:</label>
        <select id="colors">
            <option value="pink">Pink</option>
            <option value="peach">Peach</option>
            <option value="periwinkle">Periwinkle</option>
            <option value="purple">Purple</option>
        </select><br><br>
        
        <label for="pk-choice">Choose a Pokemon:</label>
        <input list="pk-opts" id="pk-choice" name="pk-choice">
        <datalist id="pk-opts">
            <option value="Pikachu">
            <option value="Jigglypuff">
            <option value="Squirtle">
            <option value="Pikachu">
            <option value="Psyduck">
        </datalist>
        <br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

        


</body>
